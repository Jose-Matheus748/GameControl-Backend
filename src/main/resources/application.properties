spring.application.name=game-control-backend-firebase

server.port=8080

# Compacta (gzip) as respostas JSON maiores que 1 KB: listas de jogos e perfis com
# foto em base64 trafegam bem menos dados, o que pesa no celular com internet móvel.
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

# JSON da conta de serviço (relativo à raiz do projeto ao rodar mvn/IDE com working dir = raiz).
# Coloque o arquivo em config/firebase-adminsdk.json (não versionado — ver .gitignore).
# Alternativa: caminho absoluto, ou deixe vazio e use GOOGLE_APPLICATION_CREDENTIALS.
firebase.credentials.path=config/firebaseKey.json

# Deve ser o mesmo "project_id" do JSON (ou vazio = o SDK usa o do JSON).
firebase.project-id=game-control-f3a59

# Web API Key do projeto (Console do Firebase > Configurações do projeto > Geral).
# Fica em config/firebase.properties (não versionado), ou na variável de ambiente FIREBASE_API_KEY.
spring.config.import=optional:file:config/firebase.properties

# true = exige ID token Firebase em todas as rotas,
# exceto aquelas explicitamente liberadas no SecurityConfig.
app.security.auth-required=true

# Coleção Firestore dos jogos (igual ao console)
firebase.collection.games=games
firebase.collection.users=users
firebase.collection.playlists=playlists
firebase.collection.gamecomments=gameComments
firebase.collection.genres=genres
firebase.collection.posts=posts
firebase.collection.postcomments=postComments
firebase.collection.reviews=reviews
firebase.collection.notifications=notifications
firebase.collection.devicetokens=deviceTokens
